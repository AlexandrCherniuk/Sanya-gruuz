name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Кнопка «Run workflow» во вкладке Actions: пересобрать сайт без пуша (например, после смены переменных).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Не секреты: адрес скрипта заявок и ID Google Ads видны в коде сайта всё равно.
          # Задаются в Settings → Secrets and variables → Actions → Variables.
          VITE_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
          VITE_GADS_ID: ${{ vars.GADS_ID }}
          VITE_GADS_LEAD_LABEL: ${{ vars.GADS_LEAD_LABEL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
